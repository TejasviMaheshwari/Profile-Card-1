<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/fontawesome-free-7.3.1-web/css/all.min.css            ">
    <style>
    

        .con{
            height: 500px;
            width:80%;
            /* border: 1px solid black; */
            margin: 150px 50px 50px  150px;
            display: flex;
    
            
        }
        .box1{
            height: 100%;
            width:2%;
            /* border: 1px solid black; */
            background-color: navy;
            border-radius: 10px;
        }
        .box2{
            font-size: 60px;
            color: teal;
            height: 100%;
            width:60%;
            /* border: 1px solid black; */
            /* letter-spacing: 5px; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-left: 20px;
            background-color: whitesmoke;
        }
        .box3{
            height: 100%;
            width:38%;
            /* border: 1px solid black; */
            box-shadow: 3px 3px 3px;
            border-radius: 30px;
            
        }
        .top{
            width: 100%;
            height: 30%;
            /* border: 1px solid black; */
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }
        .top-in
        {
            display: flex;
            width: 100%;
            height: 130px;
            /* border: 1px solid black; */
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            justify-content: center;
            align-items: end;
            background-color: navy;

        }
        h1{
            font-size: 125px;
            color: navy;
        }
        .circle{
            position: absolute;
            top: 23.1%;
            height: 120px;
            width: 120px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid navy;
            
        }
        img{
            height: 90%;
            width: 90%;
            border-radius: 100%;
        }
        .botton{
            height: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            gap: 30px;
        }
        .icon{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 70px;
            margin-top: 5%;
        }
        /* .a{
            padding: 15px;
        } */

        *{
            margin: 0px;
            padding: 0px;
        }
        .b1{
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 40%;
            background-color: navy;
            margin-top: 5%;
        }
        .b2{
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 40%;
            background-color: navy;
            margin-top: 5%;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-instagram{
            color: red;
        }
        .fa-github{
            color:violet;
        }
        .fa-linkedin{
            color: blue;
        }
        h1{
            font-size: 125px;
            color: navy;
        }
        h2{
            margin: 0px;
            padding: 5px;
        }


    </style>
</head>
<body>
    <div class="con">
        <div class="box1"></div>
        <div class="box2">
            <h1>Profile Card UI UX Design</h1>
        </div>
        <div class="box3">
            <div class="top">
            <div class="top">
                <div class="top-in">
                    <div class="circle">
                        <img src="Desert.jpg" alt="">
                    </div>
                </div>
                </div>
            </div>
            <div class="bottom">
                <h2 align="center" class="a">Software Developer</h2>
                <h3 align="center" class="a">Dezyne Ecole college</h3>
                <h4 align="center" class="a">BCA 2<sup>nd</sup> Year</h4>
                <div class="icon a" >
                    <i class="fa fa-brands fa-facebook fa-3x"></i>
                    <i class="fa fa-brands fa-instagram fa-3x"></i>
                    <i class="fa fa-brands fa-github fa-3x"></i>
                    <i class="fa fa-brands fa-linkedin fa-3x"></i>
                    <i class="fa fa-brands fa-behance fa-3x"></i>
                </div>
                <div class="botton">
                    <div class="b1">Subscribe</div>
                    <div class="b2">Message</div>
                </div>
                <div class="icon " >
                    <i class="fa fa-solid fa-heart fa-2x"></i>12.6K
                    <i class="fa fa-solid fa-comment fa-2x"></i>16K
                    <i class="fa fa-solid fa-share fa-2x"></i>10K
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
